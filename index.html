<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ngày Hội Tài Chính Số 2026</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      document.addEventListener(
        "dragstart",
        (event) => {
          if (event.target instanceof HTMLImageElement) {
            event.preventDefault();
          }
        },
        true,
      );
    </script>
    <script>
      (function detectFacebookBrowser() {
        const isFacebookApp = () => {
          const ua = navigator.userAgent || navigator.vendor;
          return (ua.indexOf("FBAN") > -1) || (ua.indexOf("FBAV") > -1) || (ua.indexOf("FB_IAB") > -1);
        };

        const isZaloApp = () => {
          const ua = navigator.userAgent || navigator.vendor;
          return ua.indexOf("Zalo") > -1;
        };

          const fullPath = `${window.location.pathname}${window.location.hash}`;

        if (isFacebookApp()) {
          const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
          if (isIOS) {
            window.location.href = `x-safari-${window.location.protocol}//${window.location.host}${fullPath}`;
          } else {
            window.location.href = `intent://${window.location.host}${fullPath}#Intent;scheme=https;end`;
          }
        }

        if (isZaloApp()) {
          const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

          if (isIOS) {
            window.location.href = `x-safari-${window.location.protocol}//${window.location.host}${fullPath}`;
          } else {
            window.location.href = `intent://${window.location.host}${fullPath}#Intent;scheme=https;end`;
          }
        }
      })();
    </script>
  </body>
</html>
